# GPT-2 Medium (355M parameters) configuration
model:
  block_size: 1024
  vocab_size: 50257
  n_layer: 24
  n_head: 16
  n_embd: 1024
  dropout: 0.1
  bias: true

training:
  batch_size: 4
  gradient_accumulation_steps: 8
  max_steps: 20000
  learning_rate: 3e-4
  min_lr: 3e-5
  warmup_steps: 1000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 500
  eval_steps: 20
  save_interval: 2000
