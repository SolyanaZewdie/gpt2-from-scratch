# Tiny GPT configuration for training locally on Shakespeare
model:
  block_size: 256
  vocab_size: 50257
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.2
  bias: true

training:
  batch_size: 16
  gradient_accumulation_steps: 1
  max_steps: 2000
  learning_rate: 1e-3
  min_lr: 1e-4
  warmup_steps: 100
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_steps: 20
  save_interval: 500
