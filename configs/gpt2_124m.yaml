# GPT-2 Small (124M parameters) configuration
model:
  block_size: 1024
  vocab_size: 50257
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1
  bias: true

training:
  batch_size: 8
  gradient_accumulation_steps: 4
  max_steps: 10000
  learning_rate: 6e-4
  min_lr: 6e-5
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_steps: 20
  save_interval: 1000
