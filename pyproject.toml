[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-from-scratch"
version = "0.1.0"
description = "A clean, educational, modular, and performant PyTorch implementation of OpenAI's GPT-2 architecture built from scratch."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Solyana Zewdie" }
]
keywords = ["gpt2", "transformer", "pytorch", "deep-learning", "language-model", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "tiktoken>=0.5.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "transformers>=4.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]
